# Independent regression checks for main and incoming pull requests.
# Unlike Pages deployment, this workflow never publishes artifacts.
name: Regression checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-core:
    name: Rust neural core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run deterministic engine unit tests
        run: cargo test --manifest-path crates/brain-core/Cargo.toml --locked

  frontend:
    name: Frontend static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: TypeScript check
        working-directory: app
        run: npx tsc -b
      - name: Lint
        working-directory: app
        run: npm run lint
