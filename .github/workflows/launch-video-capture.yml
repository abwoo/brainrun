name: Launch video capture
on:
  push:
    branches: [video/launch-capture-20261113]
    paths: [.github/workflows/launch-video-capture.yml, launch-capture/**]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - name: Capture deployed BrainRun and verify scientific controls
        run: |
          cat > /tmp/capture.py <<'PY'
          import asyncio,json,time,math,os
          from playwright.async_api import async_playwright
          OUT='capture-output'
          os.makedirs(OUT,exist_ok=True)
          async def main():
           async with async_playwright() as p:
            b=await p.chromium.launch(headless=True,args=['--use-angle=swiftshader','--enable-unsafe-swiftshader'])
            c=await b.new_context(viewport={'width':1920,'height':1080},record_video_dir=OUT,record_video_size={'width':1920,'height':1080})
            page=await c.new_page(); t0=time.monotonic(); events=[];errors=[]
            page.on('pageerror',lambda e:errors.append(str(e)))
            async def mark(name):
             state=await page.evaluate('''()=>({position:[...document.querySelectorAll('.physics-controls input[type=number]')].slice(0,3).map(e=>+e.value),direction:document.querySelector('[data-testid=physical-field]')?.dataset.direction,fieldMax:document.querySelector('[data-testid=physical-field]')?.dataset.fieldMax,selected:document.querySelector('[data-testid=selected-potential]')?.dataset.voltage,peak:document.querySelector('[data-testid=peak-potential]')?.dataset.voltage,trace:document.querySelector('[data-testid=physical-static-trace]')?.getAttribute('points'),moment:document.querySelector('input[type=number][aria-label="Source strength nA·m"]')?.value})''')
             entry={'name':name,'time':time.monotonic()-t0,'state':state};events.append(entry);print(json.dumps(entry),flush=True);return state
            async def num(label,value):
             e=page.get_by_role('spinbutton',name=label,exact=True);await e.fill(str(value));await e.press('Enter')
            async def smooth(x,y,duration=1,steps=35):
             start=await page.evaluate('()=>window.__cursorPosition||({x:0,y:0})')
             for i in range(1,steps+1):
              u=i/steps;u=u*u*(3-2*u)
              await page.mouse.move(start['x']+(x-start['x'])*u,start['y']+(y-start['y'])*u)
              await page.wait_for_timeout(duration*1000/steps)
            async def drag(kind,dx,dy,duration):
             pt=await page.evaluate('(kind)=>window.__headPhysics[kind]()',kind)
             await smooth(pt['x'],pt['y'],.25,10);await page.mouse.down()
             await smooth(pt['x']+dx,pt['y']+dy,duration,60);await page.mouse.up()
            async def setup():
             await page.get_by_role('button',name='Restore defaults',exact=True).click()
             await num('Source strength nA·m',30)
             await page.get_by_role('combobox',name='Current direction',exact=True).select_option('Z')
             await page.get_by_role('combobox',name='Sensor to inspect',exact=True).select_option('C4')
             await page.get_by_text('More settings and model details',exact=True).click()
             await page.get_by_role('combobox',name='Electrode layout',exact=True).select_option('10-10')
             await page.get_by_text('More settings and model details',exact=True).click()
             await page.locator('[data-testid=manual-electric]').evaluate('(e)=>e.scrollIntoView({block:"start"})')
             await page.mouse.move(400,500)
             await page.wait_for_timeout(400)
            try:
             await page.goto('https://abwoo.github.io/brainrun/',wait_until='networkidle',timeout=120000)
             await page.get_by_role('button',name='English',exact=True).click()
             await page.wait_for_function('()=>window.__headPhysics && document.querySelector("[data-testid=physical-field]")?.dataset.fieldMax')
             await page.evaluate('''()=>{const p=document.createElement('div');p.id='recording-cursor';p.style.cssText='position:fixed;left:0;top:0;width:18px;height:23px;z-index:2147483647;pointer-events:none;filter:drop-shadow(0 1px 2px #000)';p.innerHTML='<svg width="18" height="23" viewBox="0 0 18 23"><path d="M2 1L2 19L6.5 14.5L10 22L13 20.5L9.5 13.5L16 13Z" fill="white" stroke="#152b40" stroke-width="1.5"/></svg>';document.body.appendChild(p);document.addEventListener('pointermove',e=>{window.__cursorPosition={x:e.clientX,y:e.clientY};p.style.transform=`translate(${e.clientX}px,${e.clientY}px)`})}''')
             await setup()
             base=await mark('qa_baseline')
             await drag('source',90,-35,1);moved=await mark('qa_move')
             assert moved['position']!=base['position'] and abs(float(moved['selected'])-float(base['selected']))>1e-5
             await drag('arrow',-90,-15,1);rotated=await mark('qa_rotate')
             assert rotated['direction']!=moved['direction'] and abs(float(rotated['selected'])-float(moved['selected']))>1e-5
             await page.get_by_role('button',name='Reverse current direction',exact=True).click();rev=await mark('qa_reverse')
             assert abs(float(rev['selected'])+float(rotated['selected']))<1e-9
             await num('Source strength nA·m',-15);half=await mark('qa_half_strength')
             assert abs(float(half['selected'])-float(rev['selected'])/2)<1e-9
             await setup();await page.screenshot(path=OUT+'/setup.png');await mark('film_start')
             await drag('source',90,-35,1.8);await page.wait_for_timeout(400);await mark('hook_end')
             await drag('source',-150,65,2.4);await page.wait_for_timeout(350)
             await drag('source',60,-75,1.8);await smooth(405,440,.3,12);await page.wait_for_timeout(450);await mark('move_end')
             await drag('arrow',-100,-15,2.3);await smooth(400,450,.3,12);await page.wait_for_timeout(500);await mark('rotate_end')
             e=page.get_by_role('button',name='Reverse current direction',exact=True);box=await e.bounding_box();await smooth(box['x']+box['width']/2,box['y']+box['height']/2,.5,20);await page.mouse.click(box['x']+box['width']/2,box['y']+box['height']/2)
             await smooth(400,450,.5,20);await page.wait_for_timeout(1200);await mark('reverse_end')
             await page.screenshot(path=OUT+'/hero.png')
             await page.get_by_text('More settings and model details',exact=True).click()
             await page.get_by_role('combobox',name='Source time course',exact=True).select_option('pulse')
             await num('Physical source observation time ms',500)
             await page.locator('[data-testid=manual-electric]').evaluate('(e)=>e.scrollIntoView({block:"start"})')
             await page.get_by_role('slider',name='Physical source observation time',exact=True).focus()
             await page.locator('[data-testid=manual-electric]').evaluate('(e)=>e.scrollIntoView({block:"start"})')
             await page.mouse.move(400,450);await page.wait_for_timeout(300);await mark('pulse_start')
             # Scrub the actual observation-time control; each time sample uses the app forward model.
             for tm in range(504,704,4):
              await page.keyboard.press('ArrowRight')
              await page.wait_for_timeout(90)
             for _ in range(25):
              await page.keyboard.press('ArrowLeft')
             await page.wait_for_timeout(150)
             await page.mouse.move(400,450);await page.screenshot(path=OUT+'/pulse.png');await page.wait_for_timeout(500);await mark('pulse_end')
             await page.get_by_role('combobox',name='Source time course',exact=True).select_option('constant')
             await page.get_by_text('More settings and model details',exact=True).click()
             await page.locator('[data-testid=manual-electric]').evaluate('(e)=>e.scrollIntoView({block:"start"})')
             await smooth(400,450,.3,12);await mark('hero_start')
             # Orbit only changes the camera; no numerical change is claimed.
             field=await page.get_by_test_id('physical-field').bounding_box()
             await page.mouse.move(field['x']+field['width']*.2,field['y']+field['height']*.7);await page.mouse.down()
             await smooth(field['x']+field['width']*.2+55,field['y']+field['height']*.7+5,2,50);await page.mouse.up()
             await smooth(390,440,.3,12);await page.wait_for_timeout(4200);await mark('film_end')
             await page.screenshot(path=OUT+'/cover.png')
            finally:
             open(OUT+'/events.json','w').write(json.dumps(events,indent=2));open(OUT+'/errors.json','w').write(json.dumps(errors,indent=2))
             await c.close();await b.close()
          asyncio.run(main())
          PY
          python /tmp/capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brainrun-capture
          path: capture-output
          retention-days: 7
