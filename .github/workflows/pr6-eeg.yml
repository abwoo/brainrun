name: PR6 EEG Analysis Checks

# PR6 方法学测试（计划 PR-07–PR-12）+ 构建 + 冒烟。
# 仿照 pr5-physics.yml，但只跑 PR6 的方法学测试；完整回归、浏览器交互
# 全套、前端布局全面扫查、性能、五维验收、十个演示全部推迟到 PR8 之后
# （2026-11-11 22:57 测试节奏新规）。测试用 glob 拾取 tests/pr6 下的
# 全部测试文件，wave-2 新增的测试文件自动被跑到，无需改本文件。
# Playwright 安装绝不用 --with-deps（PR5 已证实 runner apt DNS 是坏的，
# azure.archive.ubuntu.com 解析失败）；只装浏览器二进制。
# 注意：app/tests/pr6-browser-smoke.mjs 与 bench-* 浏览器测试随最小
# 3D 闭环重建（2026-11-19）删除，由 app/tests/minimal-3d-browser.mjs
# 接替；本文件只跑最小版浏览器测试。

on:
  pull_request:
    branches: [main, p0-1-control-causality-audit] # stacked P0-1B PR; remove extra branch when rebased onto main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eeg-analysis:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Setup MNE reference Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific validation dependencies
        run: python -m pip install mne==1.11.0
      - name: Generate MNE multilayer spherical head forward model
        run: |
          python scientific/forward/generate_sphere_model.py
          python scientific/forward/generate_sphere_model.py --skull-conductivity 0.002 --output app/public/forward-assets/sphere-skull-0.002.json
          python scientific/forward/generate_sphere_model.py --skull-conductivity 0.008 --output app/public/forward-assets/sphere-skull-0.008.json
      - name: Setup Rust toolchain and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install WASM packager
        run: cargo install wasm-pack
      - name: Compile original BrainRun WASM engine for browser
        run: bash scripts/build-wasm.sh
      - name: Fetch and verify existing TVB demo assets
        run: |
          python scripts/prepare-brain-data/fetch.py
          python scripts/prepare-brain-data/prepare.py
      - name: PR6 Python methodology tests
        run: python -m unittest discover -s tests/pr6 -p 'test_*.py' -v
      - name: PR6 TypeScript methodology tests
        # Glob: wave-2 新增的 tests/pr6/*.test.mjs 会被自动拾取。
        run: node --experimental-strip-types --test tests/pr6/*.test.mjs
      - name: Regression test original Wilson-Cowan Rust engine
        run: cargo test --manifest-path crates/brain-core/Cargo.toml
      - name: Type-check frontend
        working-directory: app
        run: npx tsc -b
      - name: Build production frontend
        working-directory: app
        run: npm run build
      - name: Lint frontend
        working-directory: app
        run: npm run lint
      - name: Install browser test runner
        working-directory: app
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Playwright Chromium
        working-directory: app
        # PR5 教训：runner 解析不了 azure.archive.ubuntu.com，--with-deps
        # 里的每次 apt-get 都会失败；只装浏览器二进制（Playwright CDN
        # 可达），runner 自带的 Chrome 依赖已满足 headless 运行需要。
        # CDN 偶发失败时重试 3 次。
        run: |
          for attempt in 1 2 3; do
            echo "Playwright Chromium install, attempt $attempt/3"
            if npx playwright install chromium; then
              echo "Playwright Chromium install succeeded on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 30s..."
            sleep 30
          done
          echo "Playwright Chromium install failed after 3 attempts" >&2
          exit 1
      - name: Minimal 3D closed-loop browser test (desktop + mobile touch)
        working-directory: app
        # 最小 3D 闭环（2026-11-19）：旧台子展示删除，bench-* 与
        # pr6-browser-smoke（钻取/分析页专属）随之删除；本步覆盖
        # 场景加载、oddball 运行、多通道波形、大脑点按开 64 通道、
        # 点按切换、焦点不动、桌面 + 移动端触摸。
        run: node tests/minimal-3d-browser.mjs
