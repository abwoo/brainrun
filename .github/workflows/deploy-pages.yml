# Deploy the Vite app to GitHub Pages (project site: https://abwoo.github.io/brainrun/).
#
# Triggers only on pushes to main. Build order matters:
#   1. Rust + wasm-pack, then scripts/build-wasm.sh regenerates app/public/wasm/
#      (the WASM engine is a build artifact and is NOT committed).
#   2. npm ci + npm run build:pages (VITE_BASE=/brainrun/ so assets resolve
#      under the /brainrun/ sub-path; local dev/preview keep base '/').
#   3. Upload app/dist as the Pages artifact and deploy it.
#
# Required repo settings (already done by the maintainer): the repository is
# public and Pages is enabled with "GitHub Actions" as the source.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM engine
        run: bash scripts/build-wasm.sh

      # PR1：脑数据资产构建时生成（见 docs/data-license.md）——
      # TVB 示例数据再分发许可未明确，衍生资产不再提交进仓库；
      # 这里下载原始文件并跑 prepare.py 生成 app/public/brain-assets/，
      # Vite 构建时自动带入 dist/。fetch.py 校验失败即非零退出，
      # 构建直接失败，不静默缺资产上线。
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data-prep dependencies
        run: pip install numpy

      - name: Generate brain assets (build-time)
        run: python3 scripts/prepare-brain-data/fetch.py && python3 scripts/prepare-brain-data/prepare.py

      # PR5: MNE validated, independent four-layer spherical EEG demo.
      # Generated at build time, never checked in as third-party assets.
      - name: Install MNE-Python for forward fixture
        run: python3 -m pip install mne==1.11.0

      - name: Generate four-layer sphere forward matrix
        run: python3 scientific/forward/generate_sphere_model.py

      - name: Install template geometry tools
        run: python3 -m pip install 'nibabel>=5,<6' 'trimesh>=4,<5' 'fast-simplification>=0.1,<1'
      - name: Cache pinned fsaverage inputs
        uses: actions/cache@v4
        with:
          path: ~/mne_data/MNE-fsaverage-data
          key: fsaverage-root-1270f22c-bem-07b52d9b-v1
      - name: Generate noticed template BEM and same-coordinate sphere comparison
        run: |
          if [ ! -f "$HOME/mne_data/MNE-fsaverage-data/fsaverage/bem/fsaverage-ico-5-src.fif" ]; then
            python scientific/forward/generate_fsaverage_bem.py --download --sources-per-hemisphere 8 --montage 10-20 --package-public --output app/public/forward-assets/fsaverage-bem.json
          else
            python scientific/forward/generate_fsaverage_bem.py --sources-per-hemisphere 8 --montage 10-20 --package-public --output app/public/forward-assets/fsaverage-bem.json
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build for Pages
        working-directory: app
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
