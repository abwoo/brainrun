name: P0-2 Experiment Session & Worker Clock Gate
on:
  pull_request:
    branches: [main, p0-1-control-causality-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment-clock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Test model clock, run identity, command ACKs and artifact lineage
        run: node --experimental-strip-types --test tests/p0-2/experiment-session.test.mjs
      - name: Check TypeScript and React
        working-directory: app
        run: npx tsc -b
      - name: Lint
        working-directory: app
        run: npm run lint
