name: PR5 MRI Template BEM Scientific Validation (no asset redistribution)

on:
  push:
    branches: [feat/pr5-physics-core]
    paths:
      - scientific/forward/generate_fsaverage_bem.py
      - tests/pr5/test_fsaverage_bem_live.py
      - .github/workflows/pr5-fsaverage-bem.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fsaverage-bem:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Python scientific environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned MNE scientific solver
        run: python -m pip install 'mne==1.11.0' 'nibabel>=5,<6'
      - name: Explicitly fetch fsaverage and compute true MRI BEM
        run: |
          python scientific/forward/generate_fsaverage_bem.py \
            --download --sources-per-hemisphere 8 --montage 10-20 \
            --output .local-assets/pr5/fsaverage-bem.json
      - name: Independently validate real BEM, MRI/HEAD registration and template scalp coordinates
        run: python -m unittest discover -s tests/pr5 -p 'test_fsaverage_bem_live.py' -v
      - name: Ensure fsaverage-derived artifacts are excluded from the git repository
        run: |
          if git ls-files | grep -E '^(\.local-assets/|app/public/fsaverage/|app/public/real-bem/)'; then
            echo 'ERROR: FreeSurfer-derived assets tracked in git.' >&2
            exit 1
          fi
          git status --short
      # Intentional: DO NOT upload geometry, MRI surfaces, BEM solutions,
      # or generated JSON as publicly downloadable workflow artifacts.
      # FreeSurfer license review is required before any public distribution.
