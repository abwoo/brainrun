name: PR5 MRI Template BEM Scientific Validation (no asset redistribution)

on:
  push:
    branches: [feat/pr5-physics-core]
    paths:
      - scientific/forward/generate_fsaverage_bem.py
      - app/tests/pr5-real-bem-browser.mjs
      - app/pr5-real-bem.html
      - app/src/pr5RealBEMHarness.tsx
      - tests/pr5/test_fsaverage_bem_live.py
      - tests/pr5/fsaverage-bem-dense.test.mjs
      - .github/workflows/pr5-fsaverage-bem.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fsaverage-bem:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Python scientific environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned MNE scientific solver
        run: python -m pip install 'mne==1.11.0' 'nibabel>=5,<6' 'trimesh>=4,<5' 'fast-simplification>=0.1,<1'
      - name: Explicitly fetch fsaverage and compute true MRI BEM
        run: |
          python scientific/forward/generate_fsaverage_bem.py \
            --download --sources-per-hemisphere 8 --montage 10-20 \
            --output .local-assets/pr5/fsaverage-bem.json
      - name: Independently validate real BEM, MRI/HEAD registration and template scalp coordinates
        run: python -m unittest discover -s tests/pr5 -p 'test_fsaverage_bem_live.py' -v
      - name: Setup Node.js for real-BEM browser verification
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies and local-only browser harness
        working-directory: app
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium in isolated test runner
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Test REAL fsaverage anatomy and MNE BEM field in Chromium
        working-directory: app
        run: node tests/pr5-real-bem-browser.mjs
      - name: Generate a denser 128-source / 343-electrode MRI/BEM validation model
        run: |
          python scientific/forward/generate_fsaverage_bem.py \
            --sources-per-hemisphere 64 --montage 10-05 \
            --output .local-assets/pr5/fsaverage-bem-dense.json
      - name: Validate dense source-space and montage EEG runtime (no interpolation)
        run: node --experimental-strip-types --test tests/pr5/fsaverage-bem-dense.test.mjs
      - name: Validate dense real MRI/BEM in Chromium without distributing data
        working-directory: app
        env:
          PR5_MODEL_FILE: ../.local-assets/pr5/fsaverage-bem-dense.json
          PR5_EXPECTED_SOURCES: '128'
          PR5_EXPECTED_ELECTRODES: '343'
        run: node tests/pr5-real-bem-browser.mjs
      - name: Ensure fsaverage-derived artifacts are excluded from the git repository
        run: |
          if git ls-files | grep -E '^(\.local-assets/|app/public/fsaverage/|app/public/real-bem/)'; then
            echo 'ERROR: FreeSurfer-derived assets tracked in git.' >&2
            exit 1
          fi
          git status --short
      # Intentional: DO NOT upload geometry, MRI surfaces, BEM solutions,
      # or generated JSON as publicly downloadable workflow artifacts.
      # FreeSurfer license review is required before any public distribution.
