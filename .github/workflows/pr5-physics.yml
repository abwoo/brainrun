name: PR5 Physics Baseline Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physics-and-types:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Verify infinite-conductor analytical model (12 cases)
        run: node --experimental-strip-types --test tests/pr5/volume-conduction.test.mjs
      - name: Type-check frontend
        working-directory: app
        run: npx tsc -b
      - name: Lint frontend
        working-directory: app
        run: npm run lint
      - name: Install browser test runner
        working-directory: app
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Playwright Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test of 3D physical causality
        working-directory: app
        run: node tests/pr5-browser-smoke.mjs
      - name: Upload PR5 browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr5-dipole-lab-screenshot
          path: tests/pr5/shots/
          if-no-files-found: ignore
