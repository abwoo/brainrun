name: PR5 Physics Baseline Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physics-and-types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Verify infinite-conductor analytical model (12 cases)
        run: node --experimental-strip-types --test tests/pr5/volume-conduction.test.mjs
      - name: Type-check frontend
        working-directory: app
        run: npx tsc -b
      - name: Lint frontend
        working-directory: app
        run: npm run lint
