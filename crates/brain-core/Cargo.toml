[package]
name = "brain-core"
version = "0.1.0"
edition = "2021"
description = "Wilson-Cowan neural mass model engine for Brain Physics Playground (no frontend dependencies)"
license = "MIT OR Apache-2.0"

[lib]
name = "brain_core"
path = "src/lib.rs"

[[bin]]
name = "brain-core-run"
path = "src/bin/run.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
